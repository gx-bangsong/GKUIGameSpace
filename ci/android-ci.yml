name: GameSpace Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: gamespace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources and ROM integration files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate feature files and permissions
        run: python3 ci/validate_gamespace.py

      - name: Check whitespace errors
        run: git diff --check

  gradle:
    name: Gradle unit tests and debug build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub's Ubuntu images already contain the Android SDK.  We locate it
      # directly instead of depending on android-actions/setup-android, whose
      # Node runtime has become unavailable on newer hosted runners.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect ROM platform libraries
        id: rom-libraries
        shell: bash
        run: |
          shopt -s nullglob
          jars=(system_libs/*.jar)
          if (( ${#jars[@]} > 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#jars[@]} ROM platform library jar(s)."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::system_libs/*.jar is not present. The Gradle app needs ROM-provided platform libraries for hidden AOSP, SettingsLib, Lineage and Axion APIs; full Kotlin compilation is skipped."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        if: steps.rom-libraries.outputs.available == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        if: steps.rom-libraries.outputs.available == 'true'
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Gradle project configuration without ROM libraries
        if: steps.rom-libraries.outputs.available != 'true'
        run: ./gradlew :app:tasks --no-daemon

      - name: Upload Gradle reports
        if: always() && steps.rom-libraries.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gamespace-gradle-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/**
            app/build/outputs/apk/**
